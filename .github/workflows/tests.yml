name: WMS pure contract tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone package and test dependency
        run: python -m pip install ".[test]"
      - name: Run pure contract tests
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Retain JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms-pure-tests-junit
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7
